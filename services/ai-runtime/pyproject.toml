[project]
name = "ai-runtime"
version = "0.1.0"
description = "CORE AI Design Studio — AI agent runtime (Master Agent, LangGraph, LLM Gateway from Phase 3)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk==1.45.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_runtime"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TRY", "BLE"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy==2.4.1",
    "pip-audit>=2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
